[package]
name = "hft-engine"
version = "1.0.0"
edition = "2021"
authors = ["Kaue Caires <kaue@hackbrasil.com>"]
description = "Motor de Matching de Alta Frequencia para SIMEA"
license = "MIT"
repository = "https://github.com/kauecodify/SIMEA"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# HTTP server
warp = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.6", features = ["postgres", "runtime-tokio-native-tls", "uuid", "json", "chrono"] }

# Redis
redis = { version = "0.23", features = ["tokio-comp"] }

# Kafka
rdkafka = { version = "0.34", features = ["cmake-build"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# UUID
uuid = { version = "1.0", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# BigDecimal
bigdecimal = { version = "0.3", features = ["serde"] }

# Configuration
config = "0.13"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Metrics
metrics = "0.21"
metrics-exporter-prometheus = "0.11"

# Health checks
health-check = "0.1"
health-check-actix-web = "0.4"

[dev-dependencies]
mockall = "0.11"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
