<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMEA — Sistema Inteligente de Macroeconomia e Estabilidade Ambiental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root {
  --azul-inst: #1351B4;
  --azul-marinho: #0B1F3A;
  --branco: #FFFFFF;
  --cinza-claro: #F5F7FA;
  --cinza-medio: #DCE2EA;
  --cinza-tip: #475467;
  --verde: #16865C;
  --vermelho: #C73535;
  --amarelo-soft: #F4C430;
  --borda: #E4E7EC;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', 'IBM Plex Sans', sans-serif;
  background: var(--cinza-claro);
  color: var(--azul-marinho);
  font-size: 14px;
  line-height: 1.5;
}

/* Matrix Mode */
body.matrix-mode {
  --azul-inst: #00ff41;
  --azul-marinho: #00ff41;
  --branco: #000a00;
  --cinza-claro: #001200;
  --cinza-medio: #003a00;
  --cinza-tip: #00b030;
  --verde: #00ff41;
  --vermelho: #ff0050;
  --amarelo-soft: #88ff00;
  --borda: #003d00;
  background: #000;
  color: #00ff41;
  font-family: 'JetBrains Mono', monospace;
}

.watermark {
  position: fixed;
  bottom: 10px;
  right: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: #003d00;
  opacity: 0.5;
  letter-spacing: 1px;
  z-index: 9999;
  pointer-events: none;
}

body.matrix-mode .watermark {
  color: #00ff41;
  opacity: 0.3;
}

</style>
</head>
<body>
<div class="watermark">laboratory of k by hackbrasil</div>
<h1>SIMEA - Sistema em desenvolvimento</h1>
<p>Versão completa em construção...</p>
<script>
// Função básica para alternar modo Matrix
function toggleMatrix() {
  document.body.classList.toggle('matrix-mode');
}
</script>
</body>
</html>
